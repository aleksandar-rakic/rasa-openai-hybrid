name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install ruff mypy rasa-sdk openai

      - name: Ruff (lint + format check)
        run: ruff check actions/ && ruff format --check actions/

      - name: Mypy (type check)
        run: mypy actions/ --ignore-missing-imports

  validate-rasa:
    name: Validate RASA Training Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate RASA data
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
            rasa/rasa:3.6.21 \
            data validate --domain domain.yml --data data/

  docker:
    name: Build & Push Actions Image
    runs-on: ubuntu-latest
    needs: [lint, validate-rasa]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.actions
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-actions:latest
            ghcr.io/${{ github.repository }}-actions:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
