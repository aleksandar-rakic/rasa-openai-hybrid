name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install ruff mypy rasa-sdk openai

      - name: Ruff (lint + format check)
        run: ruff check actions/ && ruff format --check actions/

      - name: Mypy (type check)
        run: mypy actions/ --ignore-missing-imports

  validate-rasa:
    name: Validate RASA Training Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate RASA data
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
            rasa/rasa:3.6.21 \
            data validate --domain domain.yml --data data/
