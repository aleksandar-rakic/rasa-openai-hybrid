version: "3.1"

rules:
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Answer pricing questions
    steps:
      - intent: ask_pricing
      - action: utter_ask_pricing

  - rule: Answer feature questions
    steps:
      - intent: ask_features
      - action: utter_ask_features

  - rule: Transfer to human agent
    steps:
      - intent: request_human
      - action: action_transfer_to_human

  - rule: Use OpenAI for out-of-scope or low-confidence
    steps:
      - intent: out_of_scope
      - action: action_openai_fallback

  - rule: OpenAI fallback for low NLU confidence
    steps:
      - action: action_openai_fallback
