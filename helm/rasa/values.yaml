replicaCount: 2

rasa:
  image:
    repository: rasa/rasa
    tag: "3.6.21"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

actions:
  image:
    repository: ghcr.io/aleksandar-rakic/rasa-openai-hybrid-actions
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    OPENAI_MODEL: "gpt-4o-mini"
  secret:
    OPENAI_API_KEY: ""

service:
  type: ClusterIP
  rasaPort: 5005
  actionsPort: 5055

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: chatbot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: chatbot-tls
      hosts:
        - chatbot.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
